; Local-dev-only override (see docker-compose.override.yml) — the baked
; www.conf runs FPM workers as www-data regardless of the container's own
; `user:` setting, which conflicts with files owned by the host user through
; the bind mount. Running the pool as root sidesteps that entirely; this is
; never used in production (docker-compose.prod.yml has no equivalent).
[www]
user = root
group = root
