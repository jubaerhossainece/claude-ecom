name: claude-ecom

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ecom-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    env_file:
      - ../.env
    environment:
      APP_URL: http://ecomclaude.local
      DB_CONNECTION: mysql
      DB_HOST: host.docker.internal
      DB_PORT: 3306
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ecom

  nginx:
    image: nginx:stable-alpine
    container_name: ecom-nginx
    restart: unless-stopped
    volumes:
      - ..:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ecom
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.ecomclaude.rule: Host(`ecomclaude.local`)
      traefik.http.routers.ecomclaude.entrypoints: web
      traefik.http.services.ecomclaude.loadbalancer.server.port: "80"

networks:
  ecom:
    driver: bridge
  proxy:
    external: true
