name: claude-ecom

services:
  app:
    # "image:" + "build:" together: local `docker compose build` still works
    # (tags the local build as this same name), while a VPS deploy that never
    # builds can instead `docker compose pull` this exact tag from GHCR — see
    # .github/workflows/deploy.yml and CLAUDE.md's Docker deployment section.
    image: ghcr.io/jubaerhossainece/claude-ecom-app:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    volumes:
      - storage-data:/var/www/html/storage
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env.docker

  queue:
    # Same image as "app" (same build target) — queue just overrides the command.
    image: ghcr.io/jubaerhossainece/claude-ecom-app:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    volumes:
      - storage-data:/var/www/html/storage
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ../.env.docker

  nginx:
    image: ghcr.io/jubaerhossainece/claude-ecom-nginx:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: nginx
    restart: unless-stopped
    # Direct-port fallback, independent of Traefik — handy for a quick
    # curl/browser check without touching hosts entries. Traefik (below)
    # is the real routing path once APP_URL points at a real hostname.
    #
    # NOTE: "${APP_PORT}" below is resolved by Compose itself, which only
    # reads a top-level .env file (or --env-file) — the "env_file:" entries
    # above only inject vars into each container, they don't feed Compose's
    # own variable substitution. Always run compose commands with
    # `--env-file ../.env.docker` (see CLAUDE.md) or this silently falls
    # back to the default every time.
    ports:
      - "${APP_PORT:-8897}:80"
    depends_on:
      - app
    # Joins the same external network the host's shared Traefik instance
    # watches, alongside its other apps (gas-distribution's nginx,
    # agrojatra09) — see CLAUDE.md's Docker deployment section. "default"
    # keeps this container able to reach "app" by name for the fastcgi_pass
    # upstream in nginx/default.conf.
    networks:
      - default
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.claudeecom.rule: Host(`ecomclaude.local`) || Host(`admin.ecomclaude.local`)
      traefik.http.routers.claudeecom.entrypoints: web
      traefik.http.services.claudeecom.loadbalancer.server.port: "80"

networks:
  proxy:
    external: true

volumes:
  storage-data:
