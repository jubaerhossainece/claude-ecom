name: Build and deploy

# Builds the "app" and "nginx" images on GitHub's runners (not the VPS) and
# pushes them to GHCR, then SSHes into the VPS to pull the new images and
# restart the stack. Keeps composer/npm/docker-build load off the VPS —
# see CLAUDE.md's Docker deployment section.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: jubaerhossainece
  IMAGE_NAME: claude-ecom

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}-app:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}-nginx:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull new images, sync APP_KEY, and restart on the VPS
        uses: appleboy/ssh-action@v1
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP_KEY
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            cd ${{ secrets.VPS_DEPLOY_PATH }}
            git pull origin main
            # Keeps .env.docker's APP_KEY in sync with the APP_KEY secret on
            # every deploy, so there's no manual `artisan key:generate --show`
            # + paste-into-container step — see DEPLOYMENT.md Phase 6.
            # Passed via `envs:`/env var rather than interpolated into the
            # script text, and stripped of stray whitespace/newlines, so a
            # secret with trailing newline can't break the sed delimiters
            # (or worse, get shell-injected into the script).
            CLEAN_APP_KEY=$(printf '%s' "$APP_KEY" | tr -d '\n\r ')
            sed -i "s|^APP_KEY=.*|APP_KEY=${CLEAN_APP_KEY}|" .env.docker
            # docker-compose.prod.yml overlays the real-domain + TLS Traefik
            # labels on top of the base file — see docker/docker-compose.prod.yml.
            docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env.docker pull
            docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml --env-file .env.docker up -d
            docker image prune -f
