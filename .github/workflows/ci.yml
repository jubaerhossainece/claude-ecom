name: CI

# Not part of gasflow's setup (it has no test gate) — added here since this
# repo has essentially no test coverage yet (just the stock ExampleTest
# files) and Pint/PHPUnit are already in composer.json. Runs against sqlite
# in-memory per phpunit.xml, so no external DB service is needed.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite, gd, zip, intl, bcmath
          coverage: none

      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint (dry run)
        run: vendor/bin/pint --test

      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan test
